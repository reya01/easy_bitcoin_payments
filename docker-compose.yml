# Single-container install: EBP runs its own barkd wallet daemon. No token
# copying, no .env editing, no terminal commands during setup.
#
#   ./scripts/start.sh
#
# (or: docker compose up -d --build). With a public https address:
#   EBP_PUBLIC_BASE_URL=https://pay.example.com ./scripts/start.sh
#
# This is THE install: EBP runs the wallet daemon itself.
#
# Setup needs an https:// address (or http://localhost). `restart:
# unless-stopped` matters: the server restarts itself once, right after the
# setup wizard finishes, so the wallet connects.
services:
  ebp:
    # Default: build from this folder. To use a signed prebuilt image from a
    # release instead (much faster, no build), set EBP_IMAGE to the
    # `image@sha256:...` line in the release notes; start.sh then pulls it.
    image: ${EBP_IMAGE:-easy_bitcoin_payments-ebp}
    build:
      context: .
    environment:
      EBP_PUBLIC_BASE_URL: ${EBP_PUBLIC_BASE_URL:-http://localhost:8080}
      EBP_KEY_ENCRYPTION_KEY: ${EBP_KEY_ENCRYPTION_KEY:-}
      EBP_ONCHAIN_RAIL_ENABLED: ${EBP_ONCHAIN_RAIL_ENABLED:-false}
      EBP_ONCHAIN_MIN_CONFIRMATIONS: ${EBP_ONCHAIN_MIN_CONFIRMATIONS:-1}
      # Where the small till wallet empties to (your own wallet's address) and
      # how much it may hold before it does. Leave the address empty to keep
      # money in the till for now.
      EBP_SETTLEMENT_DESTINATION: ${EBP_SETTLEMENT_DESTINATION:-}
      EBP_HOT_WALLET_CAP_SATS: ${EBP_HOT_WALLET_CAP_SATS:-500000}
      EBP_SETTLEMENT_INTERVAL_SECS: ${EBP_SETTLEMENT_INTERVAL_SECS:-300}
      EBP_ALLOW_INSECURE_SETUP: ${EBP_ALLOW_INSECURE_SETUP:-false}
    ports:
      # Loopback by default: reach it through your HTTPS tunnel/proxy. Set
      # EBP_BIND_HOST=0.0.0.0 only if something you trust in front handles HTTPS.
      - "${EBP_BIND_HOST:-127.0.0.1}:8080:8080"
    volumes:
      - ebp-data:/data
    restart: unless-stopped

volumes:
  ebp-data:
