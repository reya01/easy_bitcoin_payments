#cloud-config
# Paste this whole file into your hosting provider's "user data" /
# "initialization script" box when you create the server (Ubuntu 24.04).
# Step-by-step: docs/START_HERE.md
package_update: true
package_upgrade: true
packages:
  - git
  - curl
  - ca-certificates
  - docker.io
  - docker-compose-v2
runcmd:
  # This installs the latest tested version ("main"). Leave it as it is
  # unless we tell you to use a specific release (for example v0.2.0-rc1);
  # then change "main" to that name.
  - [ sh, -c, "git clone --depth 1 --branch main https://github.com/reya01/easy_bitcoin_payments.git /opt/ebp" ]
  - [ sh, -c, "/opt/ebp/scripts/vps-setup.sh > /var/log/ebp-vps-setup.log 2>&1" ]
