# Reproducible builds (docs/dev/REPRODUCIBLE_BUILDS.md): the `ebp` binary, and the same binary
# inside the Docker image (stage 2).
#
# Builds the binary twice, on two DIFFERENT machines (Ubuntu 22.04 and Ubuntu 24.04 runners),
# with scripts/repro-build.sh, and fails if the two sha256 values differ. The build itself runs
# inside the digest-pinned Rust image, so only the host differs, which is the point: if the bytes
# match, the result does not depend on whose computer built it.
name: reproducible-build

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "Dockerfile"
      - "src/**"
      - "assets/**"
      - "migrations/**"
      - "scripts/repro-build.sh"
      - ".github/workflows/reproducible-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build on ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-22.04, ubuntu-24.04]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build with the repeatable script
        run: scripts/repro-build.sh dist-repro
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: repro-${{ matrix.runner }}
          path: |
            dist-repro/ebp.sha256
            dist-repro/build-info.txt
          if-no-files-found: error

  image:
    name: binary inside the Docker image
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the image (EBP only) and take its binary out
        run: |
          set -eu
          docker build --target runtime -t ebp-repro-check .
          id=$(docker create ebp-repro-check)
          docker cp "$id":/usr/local/bin/ebp ./ebp
          docker rm "$id" >/dev/null
          mkdir -p dist-image
          sha256sum ebp > dist-image/ebp.sha256
          cat dist-image/ebp.sha256
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: repro-image
          path: dist-image/ebp.sha256
          if-no-files-found: error

  compare:
    name: the two builds are byte-identical
    needs: [build, image]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: repro-*
          path: results
      - name: Compare
        run: |
          set -eu
          a=$(cut -d' ' -f1 results/repro-ubuntu-22.04/ebp.sha256)
          b=$(cut -d' ' -f1 results/repro-ubuntu-24.04/ebp.sha256)
          c=$(cut -d' ' -f1 results/repro-image/ebp.sha256)
          {
            echo "### Reproducible build (the ebp binary)"
            echo
            echo "- Ubuntu 22.04 runner: \`$a\`"
            echo "- Ubuntu 24.04 runner: \`$b\`"
            echo "- Inside the Docker image: \`$c\`"
            echo
            echo '```'
            cat results/repro-ubuntu-22.04/build-info.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$a" != "$b" ]; then
            echo "DIFFERENT: the two machines built different bytes." | tee -a "$GITHUB_STEP_SUMMARY"
            diff results/repro-ubuntu-22.04/build-info.txt results/repro-ubuntu-24.04/build-info.txt || true
            exit 1
          fi
          if [ "$a" != "$c" ]; then
            echo "DIFFERENT: the binary inside the Docker image is not the one the script builds." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "Identical: both machines and the Docker image have the same bytes." | tee -a "$GITHUB_STEP_SUMMARY"
