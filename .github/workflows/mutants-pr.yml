# Mutation testing on a pull request, for the lines it changed in the money code only.
#
# cargo-mutants changes those lines one at a time (`>` to `>=`, a function to `return 0`, ...)
# and runs the tests. A "missed" mutant is a change no test noticed. For now this check only
# REPORTS (the job summary lists any misses); it does not block the merge. See "Testing money
# code" in CONTRIBUTING.md.
name: mutants-pr

on:
  pull_request:
    paths:
      - "src/invoice.rs"
      - "src/manual_invoice.rs"
      - "src/payout.rs"
      - "src/rates.rs"
      - "src/reconcile.rs"
      - "src/watcher.rs"
      - "src/emergency_exit.rs"
      - "src/wallet/**"
      - ".github/workflows/mutants-pr.yml"

permissions:
  contents: read

jobs:
  mutants:
    name: mutants on changed money code (report only)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Install cargo-mutants (pinned)
        run: cargo install --locked cargo-mutants@26.2.0
      - name: Mutate the changed money lines
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -u
          git diff "$BASE"...HEAD -- src/invoice.rs src/manual_invoice.rs src/payout.rs src/rates.rs \
            src/reconcile.rs src/watcher.rs src/emergency_exit.rs src/wallet > pr.diff
          if [ ! -s pr.diff ]; then echo "No money code changed." >> "$GITHUB_STEP_SUMMARY"; exit 0; fi
          cargo mutants --no-shuffle --in-diff pr.diff || code=$?
          code=${code:-0}
          {
            echo "### Mutation testing: changed money lines (report only)"
            echo
            for k in caught missed timeout unviable; do
              echo "- $k: $(wc -l < "mutants.out/$k.txt" 2>/dev/null || echo 0)"
            done
            if [ -s mutants.out/missed.txt ]; then
              echo
              echo "Each missed change below is something no test noticed. Add a test, or add it to"
              echo "\`.cargo/mutants.toml\` with a one-line reason."
              echo '```'; cat mutants.out/missed.txt; echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          # 0 = all caught, 2 = some missed, 3 = some timed out: results, not failures (report only).
          [ "$code" = 0 ] || [ "$code" = 2 ] || [ "$code" = 3 ]
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: mutants-pr
          path: mutants.out/*.txt
          if-no-files-found: ignore
