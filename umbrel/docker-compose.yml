# Easy Bitcoin Payments — Umbrel service definitions.
#
# Umbrel installs apps by pulling the images referenced here (it does not
# build from source), so both carry TODO placeholders until they are
# published to a registry. The ebp web UI (dashboard + checkout) listens on
# port 8080 — the port the manifest declares; Umbrel's reverse proxy exposes
# it, so no host ports are published here. barkd stays on the internal
# compose network only (plain HTTP + bearer token, per barkd_start.md) with
# its datadir on a volume; `--expose-mnemonic` is deliberately NOT passed.
# Tor is not required for this package, though a connected store must be
# able to reach this server for webhooks (see docs/RECIPE_SETUP.md).

version: "3.7"

services:
  barkd:
    # TODO: publish to a registry and digest-pin, e.g.
    #   image: easybitcoinpayments/barkd:0.8.0@sha256:…
    image: easybitcoinpayments/barkd:0.8.0
    restart: on-failure
    command: ["--datadir", "/data", "--host", "0.0.0.0", "--port", "3000"]
    volumes:
      - ${APP_DATA_DIR}/data/barkd:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/ping"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  app:
    # TODO: publish to a registry and digest-pin, e.g.
    #   image: easybitcoinpayments/ebp:0.1.0@sha256:…
    image: easybitcoinpayments/ebp:0.1.0
    restart: on-failure
    depends_on:
      barkd:
        condition: service_healthy
    environment:
      EBP_BIND_ADDR: 0.0.0.0:8080
      EBP_DATABASE_PATH: /data/ebp.sqlite3
      # Set to the URL your store and customers reach this server at.
      EBP_PUBLIC_BASE_URL: ${APP_EBP_PUBLIC_BASE_URL:-http://easy-bitcoin-payments.local}
      EBP_BARKD_URL: http://barkd:3000/api/v1
      # Without a token ebp boots on the stub wallet (no payments observed).
      # TODO: wire token provisioning through the first-run wizard.
      EBP_BARKD_TOKEN: ${APP_EBP_BARKD_TOKEN:-}
      EBP_SETTLEMENT_DESTINATION: ${APP_EBP_SETTLEMENT_DESTINATION:-}
    volumes:
      - ${APP_DATA_DIR}/data/ebp:/data