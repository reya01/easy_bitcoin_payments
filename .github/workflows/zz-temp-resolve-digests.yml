# TEMPORARY: resolves the current digests of the container images we pin.
# Removed again before this PR merges.
name: temp-resolve-digests
on: pull_request
permissions:
  contents: read
jobs:
  resolve:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve image digests
        run: |
          for img in rust:1-bookworm debian:bookworm-slim caddy:2.10; do
            d=$(docker buildx imagetools inspect "$img" --format '{{json .Manifest}}' | python3 -c 'import json,sys;print(json.load(sys.stdin)["digest"])')
            echo "::notice title=digest::$img $d"
          done
