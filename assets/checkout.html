<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex, nofollow">
<title>Pay with Bitcoin</title>
<style>
:root{--accent:#f7931a;--bg:#fff;--fg:#14161a;--muted:#5b6472;--line:#e3e6eb;--ok:#12855b;--warn:#a35a00;--err:#b3261e;--radius:14px}
@media(prefers-color-scheme:dark){:root{--bg:#0f1115;--fg:#f2f4f8;--muted:#9aa4b2;--line:#242a33}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-text-size-adjust:100%;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
main{max-width:480px;margin:0 auto;padding:20px 18px 40px}header{display:flex;align-items:center;gap:10px;padding-bottom:16px;border-bottom:1px solid var(--line)}
.dot{width:10px;height:10px;border-radius:50%;background:var(--accent)}.store{font-weight:600;font-size:15px}
.amount{margin:22px 0 4px;font-size:34px;font-weight:700}.sats{color:var(--muted);font-size:15px}.countdown{margin-top:10px;font-size:14px;color:var(--muted)}
.card{margin-top:20px;border:1px solid var(--line);border-radius:var(--radius);padding:16px}.tabs{display:flex;gap:8px;margin-bottom:14px}
.tab{flex:1;padding:10px 6px;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--fg);font:inherit;font-size:13px;cursor:pointer}
.tab[aria-selected="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);font-weight:600}
.qr{display:grid;place-items:center;aspect-ratio:1/1;max-width:260px;margin:0 auto 14px;border:1px dashed var(--line);border-radius:12px;color:var(--muted);font-size:13px;text-align:center;padding:16px}
.address{display:block;width:100%;padding:12px;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--fg);font:13px/1.4 ui-monospace,Menlo,monospace;word-break:break-all;text-align:left;cursor:pointer}
.ln-fee,footer{font-size:13px;color:var(--muted)}footer{margin-top:26px}
.status{margin-top:20px;padding:14px 16px;border-radius:var(--radius);border:1px solid var(--line);font-size:15px}
.status.ok{border-color:var(--ok);color:var(--ok)}.status.warn{border-color:var(--warn);color:var(--warn)}.status.err{border-color:var(--err);color:var(--err)}
.test-banner{margin:14px 0 0;padding:10px 14px;border:1px solid var(--warn);border-radius:10px;color:var(--warn);font-size:13px;font-weight:600;text-align:center}.hidden{display:none!important}
</style>
</head>
<body>
<main>
<div class="test-banner hidden" id="test-banner" role="note">TEST MODE — signet. Play money; nothing here moves real value.</div>
<header><span class="dot" aria-hidden="true"></span><span class="store" id="store-name">Loading…</span></header>
<div class="amount" id="amount">—</div>
<div class="sats" id="sats"></div>
<div class="countdown" id="countdown"></div>
<section class="card">
<div class="tabs" role="tablist" aria-label="Payment method">
<button class="tab" role="tab" id="tab-bip321" aria-selected="true" aria-controls="panel">Bitcoin URI</button>
<button class="tab" role="tab" id="tab-ln" aria-selected="false" aria-controls="panel" hidden>Lightning</button>
<button class="tab" role="tab" id="tab-ark" aria-selected="false" aria-controls="panel">Ark</button>
<button class="tab" role="tab" id="tab-chain" aria-selected="false" aria-controls="panel">On-chain</button>
</div>
<div class="qr" id="qr">QR arrives with the Bark integration. Copy the string below into your wallet.</div>
<button class="address" id="address" type="button" title="Tap to copy">—</button>
<p class="ln-fee hidden" id="ln-fee"></p>
</section>
<div class="status" id="status" role="status" aria-live="polite">Waiting for payment…</div>
<footer><p>Bitcoin payments are final; refunds follow this store's policy. No account, no email, no tracking.</p></footer>
</main>
<script>
(function () {
"use strict";
var id = decodeURIComponent(location.pathname.split("/").filter(Boolean).pop() || "");
function $(x) { return document.getElementById(x); }
var els = { store: $("store-name"), amount: $("amount"), sats: $("sats"), cd: $("countdown"), addr: $("address"), st: $("status"), fee: $("ln-fee"), banner: $("test-banner") };
var tabs = { bip321: $("tab-bip321"), ln: $("tab-ln"), ark: $("tab-ark"), chain: $("tab-chain") };
// Byte Store drill 2026-11-02 (order 56): default = the combined BIP321
// URI (one QR, one param per enabled rail); tabs are per-rail copies and
// the old rail selector is the degraded mode (disabled rail: no param, no tab).
var s = { tab: "bip321", data: null, ln: null, uri: "", deadline: 0, poll: null, delay: 1000, t0: Date.now() };
function setStatus(t, k) { els.st.textContent = t; els.st.className = "status" + (k ? " " + k : ""); }
function render() {
  var m = { bip321: s.uri, ln: s.ln && s.ln.bolt11, ark: s.data && s.data.ark_address, chain: s.data && s.data.onchain_address };
  els.addr.textContent = (s.data ? m[s.tab] : "") || "—";
  if (s.tab === "ln" && s.ln && typeof s.ln.fee_estimate_sat === "number") {
    els.fee.textContent = "Lightning gateway fee: about " + s.ln.fee_estimate_sat.toLocaleString("en-US") + " sats, charged by the network — not by this store.";
    els.fee.classList.remove("hidden");
  } else { els.fee.classList.add("hidden"); }
}
function select(k) {
  s.tab = k;
  Object.keys(tabs).forEach(function (j) { tabs[j].setAttribute("aria-selected", String(j === k)); });
  render();
}
Object.keys(tabs).forEach(function (k) { tabs[k].addEventListener("click", function () { select(k); }); });
els.addr.addEventListener("click", function () { if (els.addr.textContent !== "—") navigator.clipboard.writeText(els.addr.textContent); });
fetch("/i/" + encodeURIComponent(id) + "/json", { headers: { "accept": "application/json" } })
  .then(function (r) { return r.ok ? r.json() : null; })
  .then(function (d) {
    if (!d) { setStatus("Invoice not found.", "err"); return; }
    s.data = d; s.uri = d.bip321 || ""; s.deadline = d.expires_at_unix || 0;
    if (d.lightning && d.lightning.bolt11) { s.ln = d.lightning; tabs.ln.hidden = false; }
    if (d.test_mode) els.banner.classList.remove("hidden");
    els.store.textContent = d.store_name || "This store";
    var sats = Number(d.amount_sats).toLocaleString("en-US");
    els.amount.textContent = d.fiat_amount ? d.fiat_currency + " " + d.fiat_amount : sats + " sats";
    els.sats.textContent = sats + " sats";
    render();
  })
  .catch(function () { setStatus("Could not load this invoice.", "err"); });
setInterval(function () {
  if (!s.deadline) return;
  var left = Math.max(0, s.deadline - Math.floor(Date.now() / 1000));
  els.cd.textContent = "Rate locked for " + Math.floor(left / 60) + ":" + ("0" + (left % 60)).slice(-2);
}, 1000);
// Byte Store practice: poll /status ~1/s while pending, stop on paid/expired,
// back off (x2, cap 30s) after 5 minutes.
function stop() { if (s.poll) { clearTimeout(s.poll); s.poll = null; } }
function again() {
  if (Date.now() - s.t0 > 300000) s.delay = Math.min(s.delay * 2, 30000);
  s.poll = setTimeout(poll, s.delay);
}
function poll() {
  fetch("/i/" + encodeURIComponent(id) + "/status", { headers: { "accept": "application/json" } })
    .then(function (r) { return r.ok ? r.json() : null; })
    .then(function (b) {
      if (!b) throw 0;
      if (b.status === "paid" || b.status === "overpaid") { setStatus("Paid — thank you! Bitcoin payments are final; refunds follow this store's policy.", "ok"); return stop(); }
      if (b.status === "expired") { setStatus("Expired — start a new invoice at the current rate.", "err"); return stop(); }
      again();
    })
    .catch(again);
}
poll();
})();
</script>
</body>
</html>
