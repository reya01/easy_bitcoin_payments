# Easy Bitcoin Payments — Umbrel app manifest.
#
# Minimal-but-valid start on the getumbrel app-store format (manifestVersion
# 1). Not yet submitted to the official store: the images are placeholders
# until they are published to a registry (see umbrel/docker-compose.yml).
# Tor is not required for this package — Umbrel's proxy serves the web UI —
# but a connected store must be able to reach this server for webhooks (see
# docs/RECIPE_SETUP.md for reachability options).

manifestVersion: 1

id: easy-bitcoin-payments
name: Easy Bitcoin Payments
tagline: Accept Bitcoin directly, self-hosted, no middleman
category: bitcoin
version: 0.1.0
port: 8080
description: >-
  Free, open-source, self-hosted Bitcoin payments for your online store.
  Invoices are priced in your currency and paid in Bitcoin over Ark, with
  on-chain and Lightning fallbacks; funds settle to your own wallet — no
  custodian, no middleman, no software fees. This preview package runs the
  ebp server with its barkd wallet sidecar on signet (test money) so you can
  try the full payment loop before going live.
developer: Easy Bitcoin Payments
website: https://github.com/easy-bitcoin-payments/ebp
repo: https://github.com/easy-bitcoin-payments/ebp
support: https://github.com/easy-bitcoin-payments/ebp/issues
submitter: Easy Bitcoin Payments
path: ""
# TODO: screenshots before any store submission.
gallery: []
releaseNotes: >-
  First preview package (signet test mode); not yet submitted to the
  official Umbrel app store.