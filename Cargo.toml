[package]
name = "easy-bitcoin-payments"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "MIT"
description = "Free, open-source, self-hosted Bitcoin payments server for online stores"
repository = "https://github.com/easy-bitcoin-payments/ebp"
readme = "README.md"
keywords = ["bitcoin", "ark", "bark", "payments", "self-hosted"]
categories = ["web-programming::http-server"]

[lib]
name = "easy_bitcoin_payments"
path = "src/lib.rs"

[[bin]]
name = "ebp"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8", features = ["macros"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "time"] }
tower-http = { version = "0.6", features = ["trace"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"
chacha20poly1305 = "0.10"
rand = "0.8"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true