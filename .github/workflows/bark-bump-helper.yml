# TEMPORARY helper for the barkd 0.8.1 move (PR #245). Delete it before merging.
#
# It does the steps a person would do by hand, on a runner that can reach GitLab:
#   1. download the barkd release binaries (amd64 and arm64) and compute their sha256
#      ourselves (never copied from a web page);
#   2. start the amd64 binary with an EMPTY throwaway datadir and fetch the OpenAPI spec it serves;
#   3. commit docs/barkd-openapi.json and docs/dev/bark-bump-result.txt back to the PR branch.
# No wallet is created, no money, no secrets.
name: bark-bump-helper

on:
  pull_request:
    paths:
      - ".github/workflows/bark-bump-helper.yml"

permissions:
  contents: write

jobs:
  fetch:
    name: fetch barkd release facts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BARK_VERSION: "0.8.1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Download both binaries and compute checksums
        run: |
          set -eu
          B="https://gitlab.com/api/v4/projects/ark-bitcoin%2Fbark/packages/generic/release-assets/bark-${BARK_VERSION}"
          mkdir -p "$RUNNER_TEMP/dl"
          for arch in x86_64 arm64; do
            curl -fsSL "$B/barkd-${BARK_VERSION}-linux-${arch}" -o "$RUNNER_TEMP/dl/barkd-${arch}"
          done
          chmod +x "$RUNNER_TEMP/dl/barkd-x86_64"
          {
            echo "barkd ${BARK_VERSION} release facts, computed by CI on $(date -u +%Y-%m-%d)"
            echo
            echo "sha256 amd64 (x86_64): $(sha256sum "$RUNNER_TEMP/dl/barkd-x86_64" | cut -d' ' -f1)"
            echo "sha256 arm64:          $(sha256sum "$RUNNER_TEMP/dl/barkd-arm64" | cut -d' ' -f1)"
            echo "version string:        $("$RUNNER_TEMP/dl/barkd-x86_64" --version)"
          } | tee "$RUNNER_TEMP/result.txt"
      - name: Compare with the release's own checksum list, if there is one
        continue-on-error: true
        run: |
          B="https://gitlab.com/api/v4/projects/ark-bitcoin%2Fbark/packages/generic/release-assets/bark-${BARK_VERSION}"
          for f in SHA256SUMS barkd-${BARK_VERSION}-SHA256SUMS; do
            if curl -fsSL "$B/$f" -o "$RUNNER_TEMP/dl/sums.txt" 2>/dev/null; then
              echo "release checksum list ($f):" | tee -a "$RUNNER_TEMP/result.txt"
              grep -i "barkd" "$RUNNER_TEMP/dl/sums.txt" | tee -a "$RUNNER_TEMP/result.txt"
              exit 0
            fi
          done
          echo "no checksum list found at the usual names; our own computed values stand" | tee -a "$RUNNER_TEMP/result.txt"
      - name: Start barkd (empty datadir) and fetch the OpenAPI spec it serves
        run: |
          set -eu
          D="$RUNNER_TEMP/bark-spec"; mkdir -p "$D"
          "$RUNNER_TEMP/dl/barkd-x86_64" --datadir "$D" --host 127.0.0.1 --port 3999 --no-ui > "$RUNNER_TEMP/barkd.log" 2>&1 &
          for i in $(seq 1 30); do [ -f "$D/auth_token" ] && curl -sS -o /dev/null "http://127.0.0.1:3999/" && break; sleep 1; done
          TOKEN=$(cat "$D/auth_token" 2>/dev/null || true)
          curl -fsS -H "Authorization: Bearer $TOKEN" http://127.0.0.1:3999/api-docs/openapi.json -o "$RUNNER_TEMP/spec.json"
          python3 - "$RUNNER_TEMP/spec.json" <<'PY'
          import json, sys
          d = json.load(open(sys.argv[1]))
          open("docs/barkd-openapi.json", "w").write(json.dumps(d, indent=2, ensure_ascii=False) + "\n")
          print("spec version:", d["info"]["version"], "paths:", len(d["paths"]))
          PY
          cp "$RUNNER_TEMP/result.txt" docs/dev/bark-bump-result.txt
          echo "spec version: $(python3 -c "import json;print(json.load(open('docs/barkd-openapi.json'))['info']['version'])")" >> docs/dev/bark-bump-result.txt
      - name: Commit the results back to the PR branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/barkd-openapi.json docs/dev/bark-bump-result.txt
          git commit -m "barkd ${BARK_VERSION}: OpenAPI spec and checksums fetched by CI" || echo "nothing changed"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
