# Signet PAYMENT drill (needs signet coins from you). Manual only.
# Starts the real single-container install plus a second barkd that acts as a
# payer wallet. The job prints (and writes to the job summary) an address; send
# signet coins there, then it pays EBP's invoices for real. Signet play money
# only; the payer wallet's words are never printed and the machine is destroyed
# at the end. The payer wallet is saved between runs (leftover coins stay in
# it); give return_to to send them somewhere else instead.
name: signet-pay

on:
  workflow_dispatch:
    inputs:
      return_to:
        description: "Signet address to send leftover coins back to (optional, an Ark address is best)"
        required: false
        default: ""
      min_sats:
        description: "Sats the payer needs before the tests start"
        required: false
        default: "20000"
      rebuild_payer:
        description: "Rebuild the saved payer wallet from its recovery words (fixes stale coin records)"
        required: false
        default: "false"
      wait_minutes:
        description: "How long to wait for you to fund it"
        required: false
        default: "55"

permissions:
  contents: read
  issues: write # post the funding address (and the report) where it can be read live

jobs:
  pay:
    name: real container + payer wallet
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The payer wallet (signet play money only) is kept between runs so
      # coins you send are never lost with the machine. Signet coins expire
      # after about a day, so use them within a day.
      - name: Restore the saved payer wallet
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: payer-wallet
          key: signet-payer-none
          restore-keys: signet-payer-
      - name: Build and start the stack
        env:
          # Small cap and fast checks so the automatic transfer to the
          # payout wallet shows up during the drill.
          EBP_HOT_WALLET_CAP_SATS: "3000"
          EBP_SETTLEMENT_INTERVAL_SECS: "30"
          EBP_ONCHAIN_SWEEP_CAP_SATS: "1000"
          # Allow switching the payout address without the 24-hour wait.
          EBP_PAYOUT_CHANGE_DELAY_SECS: "0"
          # Signet coins live about a day, shorter than the real-world 7-day
          # renewal window, which would keep every coin locked in a refresh.
          EBP_RENEWAL_LEAD_TIME_SECS: "3600"
        run: docker compose up -d --build
      - name: Put the saved payer wallet in place
        run: |
          if [ -d payer-wallet ] && [ -n "$(ls -A payer-wallet)" ]; then
            docker compose exec -T ebp mkdir -p /tmp/payer
            docker compose cp payer-wallet/. ebp:/tmp/payer
            # Files copied in are owned by root; barkd runs as the container's user.
            uid_gid="$(docker compose exec -T ebp sh -c 'echo $(id -u):$(id -g)')"
            docker compose exec -T -u root ebp sh -c "chown -R $uid_gid /tmp/payer; chmod 700 /tmp/payer; rm -f /tmp/payer/LOCK /tmp/payer/barkd.lock /tmp/payer/auth_token"
            echo "restored a saved payer wallet"
          fi
      - name: Install the browser driver
        run: |
          python3 -m pip install --user playwright
          python3 -m playwright install --with-deps chromium
      - name: Run the payment drill
        env:
          GH_TOKEN: ${{ github.token }}
          RETURN_TO: ${{ inputs.return_to }}
          MIN_SATS: ${{ inputs.min_sats }}
          WAIT_MIN: ${{ inputs.wait_minutes }}
          REBUILD_PAYER: ${{ inputs.rebuild_payer }}
        run: python3 tests/signet/pay.py
      - name: Save the payer wallet for the next run
        if: always()
        run: |
          rm -rf payer-wallet
          docker compose cp ebp:/tmp/payer payer-wallet || true
          rm -f payer-wallet/debug.log payer-wallet/auth_token payer-wallet/LOCK payer-wallet/barkd.lock
      - name: Keep the saved payer wallet
        if: always()
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: payer-wallet
          key: signet-payer-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Server log
        if: always()
        run: |
          docker compose logs --no-color --tail 300 ebp | sed -E 's/(SETUP CODE: *)[A-Z0-9-]+/\1<hidden>/' | tee server-log.txt
