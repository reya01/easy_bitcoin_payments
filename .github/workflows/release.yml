# Release plumbing (Phase 1 close-out): a v* tag push builds the release
# binaries, checksums them, publishes the GitHub release, and pushes the
# multi-arch Docker image to ghcr.io — the URLs that scripts/install.sh,
# scripts/release.sh, and docs/START_HERE.md resolve.
#
# Everything authenticates with the workflow's own GITHUB_TOKEN
# (contents: write to cut the release, packages: write to push the
# image) — no extra secrets are required.
name: release

on:
  push:
    tags:
      - "v*"
  # Dry run: Actions tab -> release -> Run workflow. Builds and tests the
  # binaries and builds the image, but publishes, pushes and signs NOTHING
  # (every publishing step below only runs for a v* tag).
  workflow_dispatch:

# Least privilege: the default for every job is read-only. Jobs that need
# more declare it themselves (the job that builds and tests third-party code
# gets no write access and no signing identity).
permissions:
  contents: read

jobs:
  binaries:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Native runner per architecture — no cross toolchain needed.
          # VERIFY: if arm64 runners are unavailable to this repo, swap
          # the aarch64 leg to ubuntu-latest and build with `cross`
          # (cargo install cross); the artifact names stay identical.
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        with:
          target: ${{ matrix.target }}

      - name: Install musl tools
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Test (offline suite, mocked barkd shapes)
        run: cargo test --all --all-features

      # VERIFY: this assumes reqwest is built with rustls (no openssl) so
      # the musl binaries link statically; if the build fails on TLS,
      # Cargo.toml is the line to fix.
      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package
        run: |
          mkdir -p dist
          # VERIFY: the crate's binary is `ebp` (as docker-compose uses);
          # adjust here if the [[bin]] name ever differs.
          tar -czf "dist/ebp-${{ matrix.target }}.tar.gz" \
            -C "target/${{ matrix.target }}/release" ebp

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ebp-${{ matrix.target }}
          path: dist/ebp-${{ matrix.target }}.tar.gz
          if-no-files-found: error

  release:
    name: publish the GitHub release (a dry run only packages and checks)
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub release
      id-token: write # keyless signing of SHA256SUMS (sigstore OIDC identity)
    needs: binaries
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          merge-multiple: true

      - name: Package the WooCommerce plugin
        run: |
          mkdir -p dist
          (cd integrations/woocommerce && zip -r -X ../../dist/ebp-bitcoin-woocommerce.zip ebp-bitcoin)

      - name: Generate SHA256SUMS
        run: |
          cd dist
          sha256sum ebp-*.tar.gz ebp-bitcoin-woocommerce.zip > SHA256SUMS
          cat SHA256SUMS

      # Checks that run on a dry run too, so a broken package is caught before
      # a real tag, not after it.
      - name: Check the packages
        run: |
          cd dist
          sha256sum -c SHA256SUMS
          unzip -l ebp-bitcoin-woocommerce.zip | grep -q 'ebp-bitcoin/ebp-bitcoin.php'
          ! unzip -l ebp-bitcoin-woocommerce.zip | grep -Eq '(tests|\.git|\.env)'
          mkdir x && tar -xzf ebp-x86_64-unknown-linux-musl.tar.gz -C x
          ./x/ebp --help | head -1
          test "$(ls ebp-*.tar.gz | wc -l)" = 2

      - name: Keep the dry-run files for inspection
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dry-run-release-files
          path: |
            dist/ebp-*.tar.gz
            dist/ebp-bitcoin-woocommerce.zip
            dist/SHA256SUMS
          retention-days: 3

      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
        if: startsWith(github.ref, 'refs/tags/v')

      # Signing the checksum file covers every tarball listed in it.
      - name: Sign SHA256SUMS (keyless)
        if: startsWith(github.ref, 'refs/tags/v')
        run: cosign sign-blob --yes --bundle dist/SHA256SUMS.sigstore.json dist/SHA256SUMS

      - name: Create the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: |
            dist/ebp-*.tar.gz
            dist/ebp-bitcoin-woocommerce.zip
            dist/SHA256SUMS
            dist/SHA256SUMS.sigstore.json
          generate_release_notes: true
          # v1.2.3-rc1 style tags are pre-releases: GitHub's "latest" (and the
          # dashboard's update notice) ignore them.
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true

  docker:
    name: push, sign and attest the multi-arch image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push the image
      id-token: write # keyless signing (sigstore) uses the workflow's OIDC identity
    needs: binaries
    outputs:
      image: ${{ steps.name.outputs.image }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Work out the image name (ghcr requires lowercase)
        id: name
        run: |
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Log in to ghcr.io
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # No `latest` tag on purpose: nothing should follow a moving tag.
      # Deployments pin the immutable digest printed in the release notes.
      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          provenance: true
          sbom: true
          tags: |
            ${{ env.IMAGE }}:${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'dry-run' }}

      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
        if: startsWith(github.ref, 'refs/tags/v')
      # Keyless signature bound to THIS workflow's identity (no key to steal).
      - name: Sign the image by digest
        if: startsWith(github.ref, 'refs/tags/v')
        run: cosign sign --yes "${IMAGE}@${{ steps.build.outputs.digest }}"

  annotate:
    name: put the verified image digest in the release notes
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write # append the digest and verify command to the release notes
    needs: [release, docker]
    steps:
      - name: Append image + verification instructions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          IMAGE: ${{ needs.docker.outputs.image }}
          DIGEST: ${{ needs.docker.outputs.digest }}
          REPO: ${{ github.repository }}
        run: |
          body="$(gh release view "$TAG" --repo "$REPO" --json body -q .body)"
          notes="$(printf '%s\n\n## Container image\n\n`%s@%s`\n\nVerify the signature (optional, advanced):\n\n```\ncosign verify %s@%s \\\n  --certificate-identity-regexp "^https://github.com/%s/\\.github/workflows/release\\.yml@" \\\n  --certificate-oidc-issuer https://token.actions.githubusercontent.com\n```\n' "$body" "$IMAGE" "$DIGEST" "$IMAGE" "$DIGEST" "$REPO")"
          gh release edit "$TAG" --repo "$REPO" --notes "$notes"