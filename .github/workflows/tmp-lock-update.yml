# TEMPORARY: prints the Cargo.lock change for url 2.5.9 (RUSTSEC-2026-0592). Removed before merge.
name: tmp-lock-update
on:
  pull_request:
    paths: [".github/workflows/tmp-lock-update.yml"]
permissions:
  contents: read
jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: |
          cargo update -p url --precise 2.5.9
          git diff Cargo.lock
          echo "BEGIN-B64"; git diff Cargo.lock | base64 -w0; echo; echo "END-B64"
