# TEMPORARY (removed before this branch is merged): downloads the barkd 0.9.0 release, checks
# it against the release's own SHA256SUMS, prints the checksums for amd64 and arm64, and saves
# the OpenAPI spec the daemon serves, so the pins in the upgrade PR are computed, never typed.
name: zz-fetch-barkd-0-9-0
on:
  push:
    branches: [barkd-0-9-0]
    paths: [".github/workflows/zz-fetch-barkd-0-9-0.yml"]
permissions:
  contents: read
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      V: "0.9.0"
      B: https://gitlab.com/api/v4/projects/ark-bitcoin%2Fbark/packages/generic/release-assets/bark-0.9.0
    steps:
      - name: Download both binaries and the release's own checksum list
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/dl"
          curl -fsSL "$B/barkd-$V-linux-x86_64" -o "$RUNNER_TEMP/dl/barkd-x86_64"
          curl -fsSL "$B/barkd-$V-linux-arm64" -o "$RUNNER_TEMP/dl/barkd-arm64"
          curl -fsSL "$B/SHA256SUMS" -o "$RUNNER_TEMP/dl/SHA256SUMS"
          echo "---- release SHA256SUMS (barkd lines) ----"
          grep "barkd-$V" "$RUNNER_TEMP/dl/SHA256SUMS"
          for a in x86_64 arm64; do
            GOT=$(sha256sum "$RUNNER_TEMP/dl/barkd-$a" | cut -d' ' -f1)
            WANT=$(grep " barkd-$V-linux-$a\$" "$RUNNER_TEMP/dl/SHA256SUMS" | cut -d' ' -f1)
            echo "COMPUTED $a $GOT"
            echo "RELEASE  $a $WANT"
            [ -n "$WANT" ] && [ "$WANT" = "$GOT" ] || { echo "MISMATCH for $a"; exit 1; }
          done
          chmod +x "$RUNNER_TEMP/dl/barkd-x86_64"
          "$RUNNER_TEMP/dl/barkd-x86_64" --version
      - name: Start it (empty datadir) and save the spec it serves
        run: |
          set -eu
          D="$RUNNER_TEMP/bark-fetch"; mkdir -p "$D"
          "$RUNNER_TEMP/dl/barkd-x86_64" --datadir "$D" --host 127.0.0.1 --port 3999 --no-ui > "$RUNNER_TEMP/barkd.log" 2>&1 &
          for i in $(seq 1 30); do [ -f "$D/auth_token" ] && curl -sS -o /dev/null "http://127.0.0.1:3999/" && break; sleep 1; done
          TOKEN=$(cat "$D/auth_token")
          curl -fsS -H "Authorization: Bearer $TOKEN" http://127.0.0.1:3999/api-docs/openapi.json -o "$RUNNER_TEMP/spec-raw.json"
          python3 -c "
          import json, sys
          d = json.load(open(sys.argv[1]))
          open(sys.argv[2], 'w').write(json.dumps(d, indent=2, ensure_ascii=False) + '\n')
          " "$RUNNER_TEMP/spec-raw.json" "$RUNNER_TEMP/spec-0.9.0.json"
          python3 -c "import json;d=json.load(open('$RUNNER_TEMP/spec-0.9.0.json'));print('spec version',d['info']['version'],'paths',len(d['paths']))"
          python3 - "$RUNNER_TEMP/spec-0.9.0.json" <<'PY'
          import json, sys
          d = json.load(open(sys.argv[1]))
          s = d["components"]["schemas"].get("SendRequest", {})
          print("SendRequest.method:", json.dumps(s.get("properties", {}).get("method"))[:400])
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: barkd-0.9.0-spec
          path: ${{ runner.temp }}/spec-0.9.0.json
