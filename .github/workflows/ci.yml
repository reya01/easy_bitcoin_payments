name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Read-only token: CI only builds and tests.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: build + test + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --all --all-features

      - name: Build release binary
        run: cargo build --release

      # Browser end-to-end: this exact binary, a fake barkd that validates
      # every request/response against the pinned OpenAPI spec, and desktop
      # Chromium driving the setup wizard, admin page and payment flows.
      - name: Install end-to-end test dependencies
        run: |
          python3 -m pip install --user playwright jsonschema
          python3 -m playwright install --with-deps chromium

      - name: Browser end-to-end test
        run: python3 tests/e2e/run_e2e.py target/release/ebp

      # WooCommerce plugin: PHP syntax + logic tests, then a real WordPress +
      # WooCommerce (docker) paying an order through this binary.
      - name: WooCommerce plugin checks
        run: |
          for f in $(find integrations -name '*.php'); do php -l "$f" >/dev/null; done
          php integrations/woocommerce/tests/core-test.php

      - name: WooCommerce end-to-end test
        run: python3 tests/woo/run_woo.py target/release/ebp

  vps-rehearsal:
    name: DigitalOcean install rehearsal (clean Ubuntu 24.04)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The packages named in deploy/cloud-init.yaml must exist on the image a
      # beginner picks (Ubuntu 24.04). A typo here would break every install.
      - name: cloud-init packages exist on Ubuntu 24.04
        run: |
          pkgs="$(python3 - <<'PY'
          import re
          t = open("deploy/cloud-init.yaml").read()
          block = t.split("packages:")[1].split("runcmd:")[0]
          print(" ".join(re.findall(r"^\s*-\s*(\S+)", block, re.M)))
          PY
          )"
          echo "packages: $pkgs"
          docker run --rm ubuntu:24.04 bash -c "apt-get update -qq && apt-get install -s $pkgs | tail -3"

      # The real script, real compose stack, real Caddy: only the public
      # certificate is replaced by Caddy's local one (domain `localhost`).
      - name: Run vps-setup.sh against the real stack
        run: |
          sudo mkdir -p /opt
          sudo ln -sfn "$PWD" /opt/ebp
          sudo EBP_SKIP_SYSTEM=1 EBP_CURL_OPTS=-k \
            EBP_START_CMD="./scripts/start.sh --domain localhost" \
            EBP_INFO_FILE=/tmp/ebp-info.txt EBP_ISSUE_FILE=/tmp/issue EBP_MOTD_FILE=/tmp/motd \
            EBP_LOG_FILE=/tmp/ebp-start.log /opt/ebp/scripts/vps-setup.sh
          echo "----- info file"; sudo cat /tmp/ebp-info.txt

      - name: The banner has the address and a setup code
        run: |
          sudo grep -q "https://localhost/setup" /tmp/ebp-info.txt
          sudo grep -Eq "[A-Z0-9]{4}(-[A-Z0-9]{4})+" /tmp/ebp-info.txt
          grep -q "https://localhost/setup" /tmp/issue
          grep -q "https://localhost/setup" /tmp/motd

      - name: Padlock side works end to end (Caddy to EBP)
        run: |
          curl -fsSk https://localhost/api/v1/health | tee /dev/stderr | grep -q .
          code="$(curl -sS -o /dev/null -w '%{http_code}' -k https://localhost/setup)"
          test "$code" = 200
          loc="$(curl -sS -o /dev/null -w '%{redirect_url}' http://localhost/)"
          echo "http redirects to: $loc"
          case "$loc" in https://localhost*) ;; *) echo "plain http must redirect to https"; exit 1;; esac

      - name: Re-running keeps the saved address
        run: |
          sudo EBP_SKIP_SYSTEM=1 EBP_CURL_OPTS=-k EBP_INFO_FILE=/tmp/ebp-info2.txt \
            EBP_ISSUE_FILE=/tmp/issue2 EBP_MOTD_FILE=/tmp/motd2 EBP_LOG_FILE=/tmp/ebp-start2.log \
            /opt/ebp/scripts/vps-setup.sh
          sudo grep -q '^EBP_DOMAIN=localhost' .env

      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 80 || true

  upgrade:
    name: upgrade + backup/restore (previous build to this build)
    runs-on: ubuntu-latest
    env:
      # The "previous release" until a real one exists: the build from before
      # the audit log, admin login and later migrations. Move this forward to
      # the last published release tag once there is one.
      BASELINE_REF: b1b20f7
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: |
            . -> target
            /tmp/ebp-old -> target
      - name: Build this version
        run: cargo build --release
      - name: Build the previous version
        run: |
          git worktree add /tmp/ebp-old "$BASELINE_REF"
          cd /tmp/ebp-old && cargo build --release
      - name: Upgrade and backup/restore test
        run: python3 tests/upgrade/run_upgrade.py /tmp/ebp-old/target/release/ebp target/release/ebp

  docker:
    name: docker image builds (amd64 + arm64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      # Both release architectures, so a build that only works on the CI
      # runner's native arch (or regresses on arm64, the tester's VPS arch)
      # fails here — never on a tester's first `docker compose build`.
      # Slow on purpose: the arm64 half runs under QEMU (expect 20–40 min).
      - name: Build image (amd64 + arm64)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          tags: easy-bitcoin-payments:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The multi-arch build above only proves the image BUILDS. Load the
      # amd64 managed image (the default, beginner-facing target) and run it:
      # the binary starts, and the checksum-pinned barkd inside it runs.
      - name: Smoke-run the managed image (amd64)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: easy-bitcoin-payments:smoke
          cache-from: type=gha

      - name: Binaries start inside the image
        run: |
          docker run --rm --entrypoint ebp easy-bitcoin-payments:smoke --help | grep -qi usage
          docker run --rm --entrypoint barkd easy-bitcoin-payments:smoke --version
          test "$(docker run --rm --entrypoint id easy-bitcoin-payments:smoke -u)" = 10001

  dependency-audit:
    name: dependency vulnerabilities (cargo audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Checks Cargo.lock against the RustSec advisory database. A known
      # vulnerability in any dependency fails the build; warnings (for
      # example an unmaintained crate) are reported but do not.
      # Always the latest cargo-audit: an old one cannot parse newer
      # advisory-database entries and fails before checking anything.
      - name: Install cargo-audit
        uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2
        with:
          tool: cargo-audit

      - name: Audit Cargo.lock
        run: cargo audit

  shellcheck:
    name: shellcheck (scripts)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Shellcheck every shipped script
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck -S warning scripts/*.sh
      - name: Automatic-https helper writes the right settings
        run: bash scripts/test_start_https.sh
      - name: VPS setup script copies the setup box to the console screen
        run: bash scripts/test_vps_setup.sh
      - name: cloud-init file is valid
        run: |
          sudo apt-get install -y -qq cloud-init >/dev/null
          cloud-init schema --config-file deploy/cloud-init.yaml
      - name: Caddyfile is valid
        run: |
          docker run --rm -e EBP_DOMAIN=203-0-113-7.sslip.io \
            -v "$PWD/docker/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2 caddy validate --config /etc/caddy/Caddyfile

  barkd-drift:
    name: barkd openapi drift check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check the barkd client's paths against the pinned OpenAPI spec
        run: bash scripts/check_barkd_drift.sh

      - name: Check every field we send or read against the pinned OpenAPI spec
        run: python3 scripts/check_barkd_contract.py
