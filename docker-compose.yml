# Single-container install: EBP runs its own barkd wallet daemon. No token
# copying, no .env editing, no terminal commands during setup.
#
#   ./scripts/start.sh
#
# (or: docker compose up -d --build). With a public https address, let
# EBP set up the padlock for you (see docs/START_HERE.md):
#   ./scripts/start.sh --https
#   ./scripts/start.sh --domain pay.example.com
#
# This is THE install: EBP runs the wallet daemon itself.
#
# Setup needs an https:// address (or http://localhost). `restart:
# unless-stopped` matters: the server restarts itself once, right after the
# setup wizard finishes, so the wallet connects.
services:
  ebp:
    # Normally this is the exact signed image that ./scripts/update.sh checked
    # and stored in .env (EBP_IMAGE=ghcr.io/...@sha256:...): downloaded, never
    # built on this server. With no EBP_IMAGE set, it builds from this folder
    # (slow; the "build it yourself" way in docs/UPGRADING.md).
    image: ${EBP_IMAGE:-easy_bitcoin_payments-ebp}
    build:
      context: .
    environment:
      # The setup page's DEFAULT network: test = play money (signet), live =
      # real bitcoin (mainnet, experimental). The owner chooses on the setup
      # page; once the wallet exists that choice is saved and always wins.
      EBP_MODE: ${EBP_MODE:-test}
      # Largest single payment request (sats). For a first real-money test,
      # set a small value such as 5000.
      EBP_MAX_INVOICE_SATS: ${EBP_MAX_INVOICE_SATS:-100000000}
      EBP_PUBLIC_BASE_URL: ${EBP_PUBLIC_BASE_URL:-http://localhost:8080}
      EBP_KEY_ENCRYPTION_KEY: ${EBP_KEY_ENCRYPTION_KEY:-}
      # Where the small till wallet empties to (your own wallet's address); it
      # sends everything once it holds the minimum. Leave it empty to keep money
      # in the till for now.
      EBP_SETTLEMENT_DESTINATION: ${EBP_SETTLEMENT_DESTINATION:-}
      EBP_ONCHAIN_SWEEP_MAX_FEE_SAT_VB: ${EBP_ONCHAIN_SWEEP_MAX_FEE_SAT_VB:-50}
      EBP_SETTLEMENT_INTERVAL_SECS: ${EBP_SETTLEMENT_INTERVAL_SECS:-300}
      EBP_PAYOUT_CHANGE_DELAY_SECS: ${EBP_PAYOUT_CHANGE_DELAY_SECS:-86400}
      EBP_RENEWAL_LEAD_TIME_SECS: ${EBP_RENEWAL_LEAD_TIME_SECS:-604800}
      EBP_ALLOW_INSECURE_SETUP: ${EBP_ALLOW_INSECURE_SETUP:-false}
      # start.sh sets this to true with --https (Caddy adds the real visitor
      # address, which the rate limiter then uses).
      EBP_TRUST_PROXY_HEADERS: ${EBP_TRUST_PROXY_HEADERS:-false}
    ports:
      # Loopback by default: reach it through your HTTPS tunnel/proxy. Set
      # EBP_BIND_HOST=0.0.0.0 only if something you trust in front handles HTTPS.
      - "${EBP_BIND_HOST:-127.0.0.1}:8080:8080"
    volumes:
      - ebp-data:/data
      # The update helper's two folders (scripts/update-helper.sh): EBP may drop an
      # update request in inbox, and only reads the helper's answers in status.
      - ./updates/inbox:/updates/inbox
      - ./updates/status:/updates/status:ro
    # Locked down. The server only ever writes to /data (its database and the wallet) and
    # to a small scratch folder, so everything else in the container is read-only. It
    # runs as an ordinary user (not root), with none of root's special powers, and cannot
    # gain any. scripts/verify_container_lockdown.sh checks all of this on a running
    # server, and CI runs it (including starting the wallet program under these limits).
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  # Automatic https. Only runs when ./scripts/start.sh --https (or --domain)
  # has been used; it remembers the choice in .env.
  caddy:
    # Pinned by digest: Caddy handles the server's https traffic (including the
    # admin password), so the exact image is fixed. Dependabot proposes updates.
    image: caddy:2.10@sha256:c3d7ee5d2b11f9dc54f947f68a734c84e9c9666c92c88a7f30b9cba5da182adb
    profiles: ["https"]
    environment:
      EBP_DOMAIN: ${EBP_DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on:
      - ebp
    # Caddy starts as root so it can listen on ports 80 and 443; that is the only
    # power it keeps, and it cannot gain more.
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

volumes:
  ebp-data:
  caddy-data:
