# Easy Bitcoin Payments — example configuration.
#
# Copy to ebp.toml (or point EBP_CONFIG at it) and edit. Every key is
# optional; anything unset falls back to the built-in default shown here.
# EBP_* environment variables override the file — see src/config.rs.
#
# The barkd bearer token is deliberately NOT a file key: it is env-only
# (EBP_BARKD_TOKEN), set in your deployment environment, never in a file
# that might get committed or backed up.

# Where the server listens. Keep it behind a reverse proxy with TLS.
bind_addr = "0.0.0.0:8080"

# SQLite database file.
database_path = "./data/ebp.sqlite3"

# The address customers and your phone open — used to build checkout URLs.
# For the supported VPS deploy, set this to your public HTTPS URL.
public_base_url = "http://localhost:8080"

# "test" (default; signet, play money, test invoices flagged and excluded
# from the accounting export) or "live" (mainnet). One flag flips the
# deployment — read docs/START_HERE.md before going live.
mode = "test"

# Invoice lifetime (minutes): the default per invoice, and the ceiling a
# store may ask for.
default_expiry_minutes = 20
max_expiry_minutes = 1440

# Default fiat currency when an invoice does not name one.
default_currency = "EUR"

# The Bitcoin price comes from five public price sources, asked every ten
# minutes in the background; the median is used. Nothing to configure except
# how long each one gets to answer (seconds).
rates_timeout_secs = 4

# The till: the server's capped hot wallet. When the off-chain balance
# passes this, the settlement engine sweeps to settlement_destination.
hot_wallet_cap_sats = 1000

# Same, when your payout address is an on-chain Bitcoin address. Higher,
# because each on-chain withdrawal pays a network fee.
onchain_sweep_cap_sats = 1000000

# An automatic on-chain withdrawal waits until network fees are at or below
# this many sats per vbyte. You can always withdraw by hand.
onchain_sweep_max_fee_sat_vb = 50

# How often the payment watcher polls barkd.
watcher_interval_secs = 10

# Timeout for webhook deliveries to the store.
webhook_timeout_secs = 10

# Log level (RUST_LOG syntax).
log_level = "info,tower_http=info"

# 64 hex characters (32 bytes): key that encrypts webhook secrets at rest.
# Generate with `openssl rand -hex 32`. Unset = a 0600 key file `ebp.key` is
# created next to the database (protects the SQLite file alone, not the whole
# volume). Prefer the env var EBP_KEY_ENCRYPTION_KEY, set from outside the
# data volume, and back the key up separately from the database.
# key_encryption_key = "…"

# Admin token for the dashboard session, if you use one.
# admin_token = "…"

# The barkd sidecar REST API. Loopback / internal container network only —
# barkd serves plain HTTP.
barkd_url = "http://127.0.0.1:3000/api/v1"

# Checkout theming.
# checkout_policy_url = "https://example.com/refund-policy"
checkout_accent_color = "#f7931a"

# Where the settlement engine sweeps the till to: your own wallet. An Ark
# address on the same ASP (e.g. Arké) sweeps via an Ark send; a Bitcoin
# on-chain address sweeps via cooperative offboarding. Unset disables
# automatic settlement.
# settlement_destination = "ark1…"

# How often the settlement engine runs.
settlement_interval_secs = 300

# The earliest EBP refreshes a coin before its expiry. EBP also reads the Ark
# server's coin lifetime and free-refresh window and waits for the free window
# (refreshing late is cheaper); this value is used as is if those cannot be read.
renewal_lead_time_secs = 604800

# Create a Lightning invoice (ASP gateway) for each checkout invoice.
lightning_receive_enabled = true

# Max requests per client per minute on the public /i/* checkout routes
# (beta hardening; 0 disables). In-memory, resets on restart.
public_rate_limit_per_min = 120

# Trust X-Forwarded-For when identifying clients for the limiter. Enable ONLY
# behind a reverse proxy you control that overwrites the header; otherwise
# every client behind the proxy shares one address (and one limit).
trust_proxy_headers = false

# Offer the on-chain rail at checkout. OFF by default in the beta: barkd's
# on-chain receive entry in /wallet/history is not yet verified by a live
# drill. Turn on (or EBP_ONCHAIN_RAIL_ENABLED=true) after running the signet
# drill in docs/dev/archive/BETA_PLAN.md. Off = no on-chain tab / URI path / address.
onchain_rail_enabled = false
# Blocks an on-chain payment needs before it counts as paid. Minimum 1: an
# unconfirmed payment can be replaced (RBF) by the sender, so it never counts.
onchain_min_confirmations = 1

# Optional FIXED setup code for the first-run wizard (automation). Leave unset
# for normal use: until setup is finished the server generates a one-time
# SETUP CODE on every start, prints it in its log, and the setup page asks for
# it. If you do set one, wizard actions need it in the X-EBP-Setup-Token
# header. Prefer the EBP_SETUP_TOKEN env var over this file.
# Setup refuses plain http:// on non-local addresses. Only for a trusted LAN or testing:
# allow_insecure_setup = false
# setup_token = "change-me"
