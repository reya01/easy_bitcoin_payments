# One-click deploy blueprint for Render (https://render.com): UNTESTED on the
# live service — try it on signet first. Render supplies HTTPS and the public
# address (RENDER_EXTERNAL_URL, read automatically). The setup code appears in
# the service's Logs tab: look for "SETUP CODE".
#
# !!! NEEDS A PAID PLAN. The wallet and database live on a persistent disk
# (/data) and Render only offers disks on paid services. On a free plan the
# disk does not exist and ALL DATA, INCLUDING THE WALLET FILES, IS ERASED on
# every restart or redeploy. Do not change `plan` to a free one.
services:
  - type: web
    name: easy-bitcoin-payments
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    healthCheckPath: /api/v1/health
    # EBP never updates itself: you choose when (Manual Deploy). Do not turn
    # this on — a payments server should not change under you unannounced.
    autoDeploy: false
    disk:
      name: ebp-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: EBP_ONCHAIN_MIN_CONFIRMATIONS
        value: "1"
